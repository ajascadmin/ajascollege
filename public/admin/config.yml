# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS — production (GitHub: aathif394/ajascollege)
# Local: run `pnpm run cms` (decap-server is only a local file bridge).
# Production: Sign in with GitHub → Cloudflare Worker (NO Netlify).

local_backend: true

backend:
  name: github
  repo: ajascadmin/ajascollege
  branch: main
  # Custom auth Worker — password form, then GitHub token (never api.netlify.com)
  base_url: https://ajas-cms-auth.ajascadmin.workers.dev
  auth_endpoint: auth

# Images live under src/ so Astro can optimize (Sharp → webp/srcset) at build time.
# public_folder is still the path stored in content (/assets/uploads/...).
media_folder: src/assets/uploads
public_folder: /assets/uploads

site_url: https://ajascollege.pages.dev
display_url: https://ajascollege.pages.dev
# UI logo (header) — official AJAS wordmark (height capped in brand.css)
logo_url: https://ajascollege.pages.dev/assets/uploads/2024/01/AJAS-Website-Heading-Last.svg
logo_link: https://ajascollege.pages.dev/

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: news
    label: "1 · News"
    icon: campaign
    label_singular: News item
    description: Campus news posts (homepage + /college-news/).
    folder: content/news
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields:
      fields: [title, date]
      default: { field: date, direction: descending }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Featured image, name: image, widget: image, required: false, choose_url: true }
      - { label: Description (SEO), name: description, widget: text, required: false }
      - { label: Permalink, name: permalink, widget: string, hint: "/college-news/your-slug/", pattern: ["^/college-news/.+/$", "Must be /college-news/slug/"] }
      - { label: Type, name: type, widget: hidden, default: article }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Date, name: date, widget: datetime, required: false }
      - { label: "Page content (visual editor)", name: body, widget: markdown, hint: "Edit like Word — headings, bold, lists, images. Never paste HTML code." }
      - label: "Video (optional)"
        name: videos
        widget: list
        required: false
        summary: "{{fields.caption}}"
        hint: "Add a video clip for this news item — upload a file OR paste a YouTube/Vimeo link, not both."
        fields:
          - { label: "Video file (mp4, upload)", name: file, widget: file, required: false, media_folder: src/assets/uploads, public_folder: /assets/uploads, hint: "Keep under 20MB." }
          - { label: "OR YouTube / Vimeo link", name: url, widget: string, required: false }
          - { label: Caption, name: caption, widget: string, required: false }

  - name: events
    label: "2 · Events"
    icon: event
    label_singular: Event
    description: Upcoming and past events (/event/).
    folder: content/events
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields:
      fields: [title, date]
      default: { field: date, direction: descending }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Featured image, name: image, widget: image, required: false, choose_url: true }
      - { label: Description (SEO), name: description, widget: text, required: false }
      - { label: Permalink, name: permalink, widget: string, hint: "/event/your-slug/", pattern: ["^/event/.+/$", "Must be /event/slug/"] }
      - { label: Type, name: type, widget: hidden, default: article }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Date, name: date, widget: datetime, required: false }
      - { label: "Page content (visual editor)", name: body, widget: markdown, hint: "Edit like Word — headings, bold, lists, images. Never paste HTML code." }
      - label: "Video (optional)"
        name: videos
        widget: list
        required: false
        summary: "{{fields.caption}}"
        hint: "Add a video clip for this event — upload a file OR paste a YouTube/Vimeo link, not both."
        fields:
          - { label: "Video file (mp4, upload)", name: file, widget: file, required: false, media_folder: src/assets/uploads, public_folder: /assets/uploads, hint: "Keep under 20MB." }
          - { label: "OR YouTube / Vimeo link", name: url, widget: string, required: false }
          - { label: Caption, name: caption, widget: string, required: false }

  - name: notices
    label: "3 · Notices & downloads"
    icon: description
    label_singular: Notice
    description: Circulars, NIRF, AISHE, RTI, IQAC PDFs — day-to-day uploads.
    folder: content/notices
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} ({{category}})"
    sortable_fields:
      fields: [title, date, category]
      default: { field: date, direction: descending }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Permalink, name: permalink, widget: string, hint: "/notices/your-slug/" }
      - label: Category
        name: category
        widget: select
        options:
          - { label: General, value: general }
          - { label: Admission, value: admission }
          - { label: Academic, value: academic }
          - { label: Compliance (NIRF/AISHE/AICTE), value: compliance }
          - { label: IQAC, value: iqac }
          - { label: Mandatory disclosure, value: mandatory }
          - { label: Administration, value: admin }
        default: general
      - { label: Date, name: date, widget: datetime, required: false }
      - label: PDF / file
        name: file
        widget: file
        media_folder: src/assets/uploads
        public_folder: /assets/uploads
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: "Notes (optional)", name: body, widget: markdown, required: false, hint: "Optional. Prefer title + PDF fields for notices." }

  - name: fees
    label: "4 · Fees & prospectus"
    icon: payments
    label_singular: Fee document
    description: Fee structure and prospectus PDFs (replace each year).
    folder: content/fees
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Permalink, name: permalink, widget: string, hint: "/fees/your-slug/" }
      - { label: Date, name: date, widget: datetime, required: false }
      - label: PDF file
        name: file
        widget: file
        media_folder: src/assets/uploads
        public_folder: /assets/uploads
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: "Notes (optional)", name: body, widget: markdown, required: false }

  - name: settings
    label: "5 · Site settings"
    icon: settings
    description: Phone, email, admission open flag, default fee PDF.
    files:
      - name: site
        label: College contact & admission
        file: content/settings/site.json
        fields:
          - { label: College name, name: college_name, widget: string }
          - { label: Short name, name: short_name, widget: string, required: false }
          - { label: Tagline, name: tagline, widget: string, required: false }
          - { label: "Phone (tel: link)", name: phone, widget: string }
          - { label: Phone (display), name: phone_display, widget: string, required: false }
          - { label: Email, name: email, widget: string }
          - { label: Address, name: address, widget: text }
          - { label: Logo, name: logo, widget: image, required: false, choose_url: true }
          - { label: "Admissions open?", name: admission_open, widget: boolean, default: true }
          - { label: Admission button label, name: admission_label, widget: string, required: false }
          - { label: Admission URL, name: admission_url, widget: string, required: false }
          - { label: Admission note, name: admission_note, widget: string, required: false }
          - label: Default fee PDF
            name: fee_pdf
            widget: file
            required: false
            media_folder: src/assets/uploads
            public_folder: /assets/uploads
          - label: Prospectus PDF
            name: prospectus_pdf
            widget: file
            required: false
            media_folder: src/assets/uploads
            public_folder: /assets/uploads


  - name: navigation
    label: "5b · Main menu"
    icon: menu
    description: "Edit menu labels and links (pages or PDFs). Remove a link by deleting the item. Nested children = dropdown."
    files:
      - name: main_menu
        label: Main navigation
        file: content/settings/navigation.json
        fields:
          - label: "Top utility bar (small links above the logo)"
            name: utility
            widget: list
            summary: "{{fields.label}}"
            hint: "The small Alumni / Placement Cell / Payments / Career / Contact row above the main logo."
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }
          - label: Main menu
            name: main
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: "Link (page path or PDF URL)", name: href, widget: string, required: false, hint: "e.g. /admission/ or /assets/uploads/….pdf" }
              - label: Sub-items
                name: children
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string, required: false }
                  - label: Nested sub-items
                    name: children
                    widget: list
                    required: false
                    summary: "{{fields.label}}"
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: Link, name: href, widget: string, required: false }
                      - label: Nested sub-items
                        name: children
                        widget: list
                        required: false
                        summary: "{{fields.label}}"
                        fields:
                          - { label: Label, name: label, widget: string }
                          - { label: Link, name: href, widget: string, required: false }

  - name: footer
    label: "5c · Footer"
    icon: dock_to_bottom
    description: "Address, phone/email, footer link columns, social links, map, copyright, bottom links. Shown on every page."
    files:
      - name: footer
        label: Site footer
        file: content/settings/footer.json
        fields:
          - { label: "Accreditation line (small text above the logos)", name: trust_line, widget: string, required: false }
          - label: Accreditation logos
            name: trust_marks
            widget: list
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { label: Logo image, name: image, widget: image }
              - { label: Name, name: name, widget: string }
          - label: "Footer link columns"
            name: columns
            widget: list
            collapsed: true
            summary: "{{fields.heading}}"
            hint: "Usually 3 columns (College / Academics / Students). Add, remove, or relabel freely."
            fields:
              - { label: Column heading, name: heading, widget: string }
              - label: Links
                name: links
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
          - label: "Follow us (social links)"
            name: social
            widget: list
            collapsed: true
            summary: "{{fields.icon}}"
            fields:
              - { label: "Icon (Font Awesome name, no \"fa-\" prefix)", name: icon, widget: string, hint: "e.g. facebook, instagram, linkedin, youtube-play — browse names at fontawesome.com/v4/icons" }
              - { label: Profile URL, name: url, widget: string }
              - { label: "Accessible label (optional)", name: label, widget: string, required: false }
          - { label: "Map embed URL", name: map_embed_url, widget: string, required: false, hint: "Google Maps → Share → Embed a map → copy the src=\"...\" URL." }
          - { label: "\"Open in Google Maps\" link", name: map_link_url, widget: string, required: false }
          - label: "Bottom bar links"
            name: bottom_nav
            widget: list
            collapsed: true
            summary: "{{fields.label}}"
            hint: "The small link row next to the copyright line."
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }

  - name: listings
    label: "5d · Section intros"
    icon: view_list
    description: "Heading, search-engine description, and intro paragraph at the top of each list page (News, Events, Notices, Fees, Programmes, Faculty, Departments, Labs, Clubs & Cells)."
    files:
      - name: listings
        label: Section intros
        file: content/settings/listings.json
        fields:
          - label: News
            name: news
            widget: object
            collapsed: true
            fields: &section_fields
              - { label: Page heading, name: title, widget: string }
              - { label: "Search-engine description", name: description, widget: text }
              - { label: Intro paragraph, name: intro, widget: text }
          - label: Events
            name: events
            widget: object
            collapsed: true
            fields: *section_fields
          - label: Notices
            name: notices
            widget: object
            collapsed: true
            fields: *section_fields
          - label: Fees
            name: fees
            widget: object
            collapsed: true
            fields: *section_fields
          - label: Programmes
            name: programmes
            widget: object
            collapsed: true
            fields: *section_fields
          - label: Faculties
            name: faculties
            widget: object
            collapsed: true
            fields: *section_fields
          - label: Departments
            name: departments
            widget: object
            collapsed: true
            fields: *section_fields
          - label: Labs
            name: labs
            widget: object
            collapsed: true
            fields: *section_fields
          - label: Clubs & Cells
            name: clubs
            widget: object
            collapsed: true
            fields: *section_fields

  - name: prospectus
    label: "5e · Prospectus page"
    icon: menu_book
    description: "Every section of the /prospectus-2026-27/ page — hero, about, committee, programme fees, admission steps."
    files:
      - name: prospectus
        label: Prospectus page
        file: content/settings/prospectus.json
        fields:
          - label: "1 · Hero"
            name: hero
            widget: object
            collapsed: true
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Tagline, name: tagline, widget: string }
              - { label: "Lead line (accreditation strip)", name: lead, widget: string }
          - label: "2 · About Us"
            name: about
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: value, widget: text }
          - label: "3 · At a glance stats"
            name: glance
            widget: list
            collapsed: true
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Value, name: value, widget: string }
          - { label: "4 · Vision", name: vision, widget: text }
          - { label: "5 · Mission", name: mission, widget: text }
          - label: "6 · Management Committee"
            name: committee
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Members
                name: members
                widget: list
                summary: "{{fields.name}} — {{fields.role}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Role, name: role, widget: string }
              - { label: "Note (optional, supports a [link](/path/) )", name: note, widget: string, required: false }
          - label: "7 · Programmes & Fees"
            name: programmes
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Intro paragraph, name: intro, widget: text }
              - { label: "UG section heading", name: ug_heading, widget: string }
              - label: UG programmes
                name: ug
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Eligibility, name: eligibility, widget: text }
                  - { label: "Fee / semester (₹, digits only)", name: fee, widget: string }
              - { label: "PG section heading", name: pg_heading, widget: string }
              - label: PG programmes
                name: pg
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Eligibility, name: eligibility, widget: text }
                  - { label: "Fee / semester (₹, digits only)", name: fee, widget: string }
          - label: "8 · Add-On / Certificate Courses"
            name: addon
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text }
              - label: Courses
                name: courses
                widget: list
                field: { label: Course, name: value, widget: string }
          - label: "9 · Infrastructure"
            name: infrastructure
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Items
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: "Icon (Font Awesome class, e.g. fa-book)", name: icon, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
          - label: "10 · Flagship programmes"
            name: flagship
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Cards
                name: items
                widget: list
                summary: "{{fields.kicker}}"
                hint: "Usually exactly 2 cards."
                fields:
                  - { label: Name, name: kicker, widget: string }
                  - { label: Text, name: text, widget: text }
          - label: "11 · Admission process"
            name: admission
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: "Management admission — title", name: management_title, widget: string }
              - label: "Management admission — steps"
                name: management_steps
                widget: list
                field: { label: Step, name: value, widget: text }
              - { label: "Merit admission — title", name: merit_title, widget: string }
              - label: "Merit admission — steps"
                name: merit_steps
                widget: list
                field: { label: Step, name: value, widget: text }
              - { label: "Note (optional)", name: note, widget: text, required: false }
          - label: "12 · Download CTA"
            name: download_cta
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Button label, name: button_label, widget: string }

  - name: home
    label: "6 · Homepage"
    icon: home
    description: "Every section of the homepage — hero, cards, gallery, testimonials, CTA."
    files:
      - name: homepage
        label: Homepage
        file: content/home/homepage.json
        fields:
          - { label: "Browser tab title", name: title, widget: string, hint: "Shown as \"<this> | Al Jamia Arts & Science College\" in the browser tab and search results." }
          - { label: "Search-engine description", name: description, widget: text }

          - label: "1 · Hero video"
            name: hero
            widget: object
            collapsed: true
            summary: "Full-bleed video at the very top of the page"
            fields:
              - label: Background video
                name: video
                widget: file
                media_folder: src/assets/uploads
                public_folder: /assets/uploads
                hint: "MP4, muted & looping. Keep it well under 15MB — it autoplays for every visitor."

          - label: "2 · Quick-action tiles"
            name: quick_actions
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            hint: "The 3 tiles directly under the hero video (Admissions / Programmes / Prospectus by default)."
            fields:
              - { label: "Icon (Font Awesome name, no \"fa-\" prefix)", name: icon, widget: string, hint: "e.g. pencil-square-o — browse names at fontawesome.com/v4/icons" }
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Button text, name: cta_label, widget: string }
              - { label: Link, name: url, widget: string }
              - label: Colour style
                name: style
                widget: select
                options: [primary, navy, light]
                default: primary

          - label: "3 · Accreditation strip"
            name: accreditation
            widget: object
            collapsed: true
            summary: "\"Affiliated, recognised & accredited by...\" logo row"
            fields:
              - { label: Label text, name: label, widget: string }
              - label: Logos
                name: items
                widget: list
                collapsed: true
                summary: "{{fields.name}}"
                fields:
                  - { label: Logo image, name: image, widget: image }
                  - { label: Name, name: name, widget: string }

          - label: "4 · About blurb"
            name: about
            widget: object
            collapsed: true
            summary: "Short \"Al Jamia Arts and Science College (AJASC)\" intro paragraph"
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: value, widget: text }
              - { label: Button text, name: cta_label, widget: string }
              - { label: Button link, name: cta_url, widget: string }

          - label: "5 · Stats banner"
            name: metrics
            widget: list
            collapsed: true
            summary: "{{fields.value}} — {{fields.label}}"
            hint: "The 4000+ Students / 11 UG / 3 PG / 14 Total row."
            fields:
              - { label: Number, name: value, widget: string }
              - { label: Label, name: label, widget: string }

          - label: "6 · Chairman's message"
            name: chairman_message
            widget: object
            collapsed: true
            fields:
              - { label: "Name (shown above the heading)", name: kicker, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Photo, name: photo, widget: image }
              - { label: "Photo links to", name: photo_url, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: value, widget: text }
              - { label: Button text, name: cta_label, widget: string }
              - { label: Button link, name: cta_url, widget: string }

          - label: "7 · Principal's message"
            name: principal_message
            widget: object
            collapsed: true
            fields:
              - { label: "Name (shown above the heading)", name: kicker, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Photo, name: photo, widget: image }
              - { label: "Photo links to", name: photo_url, widget: string }
              - { label: Pull-quote, name: quote, widget: text }
              - label: Bullet points
                name: bullet_points
                widget: list
                field: { label: Point, name: value, widget: string }
              - { label: Button text, name: cta_label, widget: string }
              - { label: Button link, name: cta_url, widget: string }

          - label: "8 · Programmes & departments"
            name: programmes
            widget: object
            collapsed: true
            summary: "UG/PG programme cards + the 11 department cards"
            fields:
              - { label: "Section eyebrow", name: kicker, widget: string }
              - { label: "Section heading", name: heading, widget: string }
              - { label: "Section intro sentence", name: intro, widget: text }
              - label: "UG (Honours) card"
                name: ug
                widget: object
                collapsed: true
                fields:
                  - { label: "Icon (Font Awesome name)", name: icon, widget: string }
                  - { label: "Level tag", name: level_tag, widget: string }
                  - { label: Card title, name: title, widget: string }
                  - { label: "Meta line", name: meta, widget: string }
                  - label: Programme chips
                    name: items
                    widget: list
                    collapsed: true
                    summary: "{{fields.label}}"
                    hint: "Keep in sync with the Programmes collection below — this list is just the homepage chips, editing here does not create/remove a programme page."
                    fields:
                      - { label: "Icon (Font Awesome name)", name: icon, widget: string, required: false, default: check-circle }
                      - { label: Label, name: label, widget: string }
                      - { label: Link, name: url, widget: string }
                  - { label: "Primary button text", name: cta_primary_label, widget: string }
                  - { label: "Primary button link", name: cta_primary_url, widget: string }
                  - { label: "Secondary button text", name: cta_secondary_label, widget: string }
                  - { label: "Secondary button link", name: cta_secondary_url, widget: string }
              - label: "PG card"
                name: pg
                widget: object
                collapsed: true
                fields:
                  - { label: "Icon (Font Awesome name)", name: icon, widget: string }
                  - { label: "Level tag", name: level_tag, widget: string }
                  - { label: Card title, name: title, widget: string }
                  - { label: "Meta line", name: meta, widget: string }
                  - label: Programme chips
                    name: items
                    widget: list
                    collapsed: true
                    summary: "{{fields.label}}"
                    fields:
                      - { label: "Icon (Font Awesome name)", name: icon, widget: string, required: false, default: star }
                      - { label: Label, name: label, widget: string }
                      - { label: Link, name: url, widget: string }
                  - { label: "Highlight icon (Font Awesome name)", name: highlight_icon, widget: string, required: false }
                  - { label: "Highlight box text", name: highlight_text, widget: text }
                  - { label: "Primary button text", name: cta_primary_label, widget: string }
                  - { label: "Primary button link", name: cta_primary_url, widget: string }
                  - { label: "Secondary button text", name: cta_secondary_label, widget: string }
                  - { label: "Secondary button link", name: cta_secondary_url, widget: string }
              - { label: "Departments eyebrow", name: departments_kicker, widget: string }
              - { label: "Departments heading", name: departments_heading, widget: string }
              - label: "Department cards"
                name: departments
                widget: list
                collapsed: true
                summary: "{{fields.title}}"
                hint: "One card per department shown on the homepage grid. Add/remove/reorder freely."
                fields:
                  - { label: "Badge icon (Font Awesome name)", name: icon, widget: string }
                  - { label: "Badge text", name: badge_label, widget: string }
                  - { label: Photo, name: image, widget: image }
                  - { label: Title, name: title, widget: string }
                  - { label: "Links to", name: url, widget: string }
                  - { label: Description, name: description, widget: text }
                  - label: Pills
                    name: pills
                    widget: list
                    required: false
                    field: { label: Pill, name: value, widget: string }
              - { label: "\"View all\" button text", name: view_all_label, widget: string }
              - { label: "\"View all\" button link", name: view_all_url, widget: string }

          - label: "9 · Campus gallery carousel"
            name: gallery
            widget: object
            collapsed: true
            summary: "\"Campus & event footages\" carousel"
            fields:
              - { label: "Section eyebrow", name: kicker, widget: string }
              - { label: "Section heading", name: heading, widget: string }
              - label: Slides
                name: slides
                widget: list
                collapsed: true
                summary: "{{fields.title}}"
                fields:
                  - { label: Photo, name: image, widget: image }
                  - { label: Title, name: title, widget: string }
                  - { label: Caption, name: caption, widget: string }
              - { label: Button text, name: cta_label, widget: string }
              - { label: Button link, name: cta_url, widget: string }

          - label: "10 · Services band"
            name: services
            widget: object
            collapsed: true
            summary: "Library / Laboratories / Seminar Hall band"
            fields:
              - label: Items
                name: items
                widget: list
                collapsed: true
                summary: "{{fields.title}}"
                hint: "Usually exactly 3 items — the layout is a 3-column band."
                fields:
                  - { label: "Icon (Font Awesome name)", name: icon, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: Button text, name: cta_label, widget: string }
                  - { label: Button link, name: cta_url, widget: string }

          - label: "11 · Why choose AJAS + apply CTA"
            name: benefits
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Reasons
                name: items
                widget: list
                collapsed: true
                summary: "{{fields.title}}"
                hint: "Usually exactly 4 items — the layout is a 2×2 grid."
                fields:
                  - { label: "Icon (Font Awesome name)", name: icon, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: "Links to", name: url, widget: string }
              - { label: "\"Apply for admission\" heading", name: cta_heading, widget: string }
              - { label: "\"Apply for admission\" text", name: cta_text, widget: text }
              - { label: "Primary button text", name: cta_primary_label, widget: string }
              - { label: "Primary button link", name: cta_primary_url, widget: string }
              - { label: "Secondary button text", name: cta_secondary_label, widget: string }
              - { label: "Secondary button link", name: cta_secondary_url, widget: string }

          - label: "12 · Upcoming events"
            name: events
            widget: object
            collapsed: true
            hint: "A hand-picked homepage preview — this does not read from the Events collection automatically, so update both when an event changes."
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Events
                name: items
                widget: list
                collapsed: true
                summary: "{{fields.title}}"
                hint: "Up to 3 — the layout is numbered 1/2/3 with 2 photos on the right."
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: "Links to", name: url, widget: string }
                  - { label: "Date (as displayed)", name: date, widget: string }
                  - { label: Location, name: location, widget: string }
                  - { label: Photo, name: image, widget: image, required: false }
              - { label: "\"All events\" button text", name: cta_label, widget: string }
              - { label: "\"All events\" button link", name: cta_url, widget: string }

          - label: "13 · Student testimonials"
            name: testimonials
            widget: object
            collapsed: true
            fields:
              - { label: "Section eyebrow", name: kicker, widget: string }
              - { label: "Section heading", name: heading, widget: string }
              - label: Testimonials
                name: items
                widget: list
                collapsed: true
                summary: "{{fields.name}}"
                fields:
                  - { label: Photo, name: photo, widget: image }
                  - { label: Quote, name: quote, widget: text }
                  - { label: Name, name: name, widget: string }
                  - { label: "Role / batch", name: role, widget: string }

          - label: "14 · Closing call-to-action"
            name: quick_link_cta
            widget: object
            collapsed: true
            summary: "\"Ready to get started?\" band + Quick Link list"
            fields:
              - { label: "Small caption above the heading", name: kicker, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Body text, name: text, widget: text }
              - { label: "Primary button text", name: primary_label, widget: string }
              - { label: "Primary button link", name: primary_url, widget: string }
              - { label: "Secondary button text", name: secondary_label, widget: string }
              - { label: "Secondary button link", name: secondary_url, widget: string }
              - { label: "\"Quick Link\" box heading", name: quicklinks_heading, widget: string }
              - label: Quick links
                name: quicklinks
                widget: list
                collapsed: true
                summary: "{{fields.label}}"
                fields:
                  - { label: "Icon (Font Awesome name)", name: icon, widget: string }
                  - { label: Label, name: label, widget: string }
                  - { label: Link (page path, or a PDF), name: url, widget: string }
                  - { label: "Open in a new tab? (use for PDFs)", name: external, widget: boolean, default: false }

  - name: programmes
    label: "7 · Programmes"
    icon: school
    label_singular: Programme
    description: UG/PG courses listed on /programmes/.
    folder: content/programmes
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} ({{level}})"
    sortable_fields:
      fields: [title, level, order]
      default: { field: order, direction: ascending }
    fields:
      - { label: Programme name, name: title, widget: string }
      - label: Level
        name: level
        widget: select
        options:
          - { label: UG (Honours), value: ug }
          - { label: PG, value: pg }
          - { label: Certificate, value: certificate }
          - { label: Other, value: other }
        default: ug
      - { label: Sort order, name: order, widget: number, default: 0, value_type: int }
      - { label: Permalink, name: permalink, widget: string, hint: "/programmes/your-slug/" }
      - { label: Department, name: department, widget: string, required: false }
      - { label: Duration, name: duration, widget: string, required: false }
      - { label: Seats, name: seats, widget: string, required: false }
      - { label: Description (SEO), name: description, widget: text, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: "Programme details (visual editor)", name: body, widget: markdown, hint: "Edit like Word. No HTML." }

  - name: faculty
    label: "8 · Faculty"
    icon: badge
    label_singular: Faculty member
    description: Faculty profiles (/faculties/…).
    folder: content/faculty
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{role}}"
    fields:
      - { label: Full name (title), name: title, widget: string }
      - { label: Photo, name: image, widget: image, required: false, choose_url: true }
      - { label: Display name, name: name, widget: string, required: false }
      - { label: Role, name: role, widget: string, required: false }
      - { label: Credentials, name: credentials, widget: string, required: false }
      - { label: Description (SEO), name: description, widget: text, required: false }
      - { label: Permalink, name: permalink, widget: string, hint: "/faculties/your-slug/" }
      - { label: Type, name: type, widget: hidden, default: profile }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: "Biography (visual editor)", name: body, widget: markdown, hint: "Write the bio like Word. No HTML." }

  - name: pages
    label: "9 · Other pages"
    icon: article
    label_singular: Page
    description: About, IQAC, labs, clubs, static info pages.
    folder: content/pages
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    path: "{{slug}}"
    nested:
      depth: 4
      summary: "{{title}}"
    summary: "{{title}} — {{permalink}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description (SEO), name: description, widget: text, required: false }
      - { label: Permalink, name: permalink, widget: string }
      - label: Page type
        name: type
        widget: select
        options: [home, page, listing, profile, article]
        default: page
        hint: "Templates for new pages — pick a type, then fill only the matching block below (leave the others empty): Page = prose in the content editor below (headings/lists/tables all get styled automatically); Listing = index page, use Menu / index cards; a Staff / committee directory or Photo gallery can be added to ANY page type."
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Featured image, name: image, widget: image, required: false, choose_url: true }
      - { label: Name (profiles), name: name, widget: string, required: false }
      - { label: Role (profiles), name: role, widget: string, required: false }
      - { label: Credentials, name: credentials, widget: string, required: false }
      - { label: "Page content (visual editor)", name: body, widget: markdown, required: false, hint: "Edit like Word — headings, bold, lists, tables. Never paste HTML code, and never paste photos or a staff list here — use the dedicated fields below instead, they render as proper grids." }
      - label: "Staff / committee directory (optional)"
        name: people
        widget: list
        required: false
        summary: "{{fields.name}} — {{fields.role}}"
        hint: "Use for any page that's a list of people (staff, committee, wardens). Renders as a photo-card grid — don't list people in the content editor above."
        fields:
          - { label: Photo, name: photo, widget: image, required: false }
          - { label: Name, name: name, widget: string }
          - { label: Role / designation, name: role, widget: string, required: false }
          - { label: Phone (optional), name: phone, widget: string, required: false }
      - label: "Menu / index cards (optional)"
        name: menu_items
        widget: list
        required: false
        summary: "{{fields.title}}"
        hint: "Use for a page that's just a menu of links to other pages (e.g. an index/listing page). Renders as a card grid — don't list links in the content editor above."
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Link (page path or URL), name: href, widget: string, required: false }
          - { label: Description, name: description, widget: text, required: false }
      - label: "Photo gallery (optional)"
        name: gallery
        widget: list
        required: false
        hint: "Shows as a proper photo grid (with lightbox) at the bottom of the page — don't paste photo dumps into the content editor above."
        field: { label: Image, name: image, widget: image }
      - label: "Video (optional)"
        name: videos
        widget: list
        required: false
        summary: "{{fields.caption}}"
        hint: "Add a video to this page — upload a file OR paste a YouTube/Vimeo link, not both. Shows near the bottom of the page."
        fields:
          - { label: "Video file (mp4, upload)", name: file, widget: file, required: false, media_folder: src/assets/uploads, public_folder: /assets/uploads, hint: "Keep under 20MB." }
          - { label: "OR YouTube / Vimeo link", name: url, widget: string, required: false }
          - { label: Caption, name: caption, widget: string, required: false }
      - label: "Downloads / attachments (optional)"
        name: attachments
        widget: list
        required: false
        summary: "{{fields.label}}"
        hint: "Shows as a download list at the bottom of the page. Use for PDFs, forms, brochures — anything besides the main content."
        fields:
          - { label: Link text, name: label, widget: string }
          - label: File
            name: file
            widget: file
            media_folder: src/assets/uploads
            public_folder: /assets/uploads
