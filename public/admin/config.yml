# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS — Al Jamia Arts & Science College
#
# How this file is organised (same order the editors see in the sidebar):
#   DAILY UPDATES   popups, news, events, notices & PDFs, fees & prospectus
#   PAGES           homepage, every other page, programmes, faculty
#   SITE-WIDE       menu, footer, list-page intros, prospectus page, contact
#
# Every collection says WHERE on the website it shows up, and has a
# preview_path so the editor gets a "View on site" link for each entry.
# The preview pane next to the form shows the REAL page, updating as you type
# (public/admin/cms-init.js) — click anything in it to jump to its field.
# On the live site, staff also get an "Edit this page" button
# (src/components/EditorBar.astro) that jumps straight back here.
#
# MEDIA — two folders, both published at /assets/uploads/…:
#   src/assets/uploads     images (Astro resizes them to webp at build time)
#   public/assets/uploads  PDFs, Word/Excel files, videos (served as-is)
# Every File field below saves to the second one. Field-level media_folder
# MUST start with "/" — without it Sveltia treats the path as relative to the
# collection folder, which is why uploaded PDFs used to go missing.

backend:
  name: github
  repo: ajascadmin/ajascollege
  branch: main
  # Custom auth Worker — password form, then GitHub token (never api.netlify.com)
  base_url: https://ajas-cms-auth.ajascadmin.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: "Add {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

# Images (global media library)
media_folder: src/assets/uploads
public_folder: /assets/uploads

# PDFs, documents and videos get their own library in the Assets screen.
asset_collections:
  - name: documents
    label: "Documents, PDFs & videos"
    icon: picture_as_pdf
    media_folder: /public/assets/uploads
    public_folder: /assets/uploads

site_url: https://ajascollege.pages.dev
display_url: https://ajascollege.pages.dev
logo:
  src: https://ajascollege.pages.dev/assets/uploads/2024/01/AJAS-Website-Heading-Last.svg

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  # ════════════════════════════ DAILY UPDATES ════════════════════════════

  - name: popups
    label: "Popup announcements"
    label_singular: Popup
    icon: campaign
    description: >-
      The poster that pops up when someone opens the website (admissions,
      new programmes, events). Upload the poster, choose dates, done — it
      appears on the start date and disappears after the end date by itself.
      To try one before switching it on, open the site with ?popup=preview at
      the end of the address.
    folder: content/popups
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}}  ·  {{enabled | ternary('● ON', '○ off')}}  ·  {{start}} → {{end}}"
    thumbnail: image
    sortable_fields:
      fields: [title, start, order]
      default: { field: order, direction: ascending }
    fields:
      - { label: "Name (for you — visitors don't see this)", name: title, widget: string, hint: "e.g. “B.Sc Microbiology admission poster”. Also used as the image description for screen readers." }
      - { label: "Switched on?", name: enabled, widget: boolean, default: true, hint: "Turn off to hide the popup without deleting it." }
      - { label: "Poster image", name: image, widget: image, hint: "A square or portrait poster works best (e.g. 1080×1080 or 1080×1350). JPG or PNG." }
      - { label: "When clicked, go to (optional)", name: link, widget: string, required: false, hint: "A page like /admission/, a PDF, or a full https:// address. Leave empty if the poster isn't clickable." }
      - { label: "Button under the poster (optional)", name: button_label, widget: string, required: false, hint: "e.g. “Apply now”. Only shows when a link is set." }
      - { label: "Start showing on", name: start, widget: datetime, required: false, format: YYYY-MM-DD, time_format: false, hint: "Leave empty to start straight away." }
      - { label: "Stop showing after", name: end, widget: datetime, required: false, format: YYYY-MM-DD, time_format: false, hint: "Leave empty to keep showing until you switch it off." }
      - label: "Show on"
        name: pages
        widget: select
        default: home
        options:
          - { label: "Homepage only", value: home }
          - { label: "Every page", value: all }
      - label: "How often each visitor sees it"
        name: frequency
        widget: select
        default: session
        options:
          - { label: "Once per visit (recommended)", value: session }
          - { label: "Once per day", value: day }
          - { label: "Every time a page loads", value: always }
      - { label: "Order (if several are on at once)", name: order, widget: number, value_type: int, default: 0, hint: "Lower numbers show first. Visitors see them one after another." }

  - name: news
    label: "News"
    label_singular: News post
    icon: newspaper
    description: "News posts. Show on /college-news/ (newest first) and in the site search. The URL is created automatically from the title."
    folder: content/news
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "/college-news/{{slug}}/"
    permalink_field: true
    summary: "{{title}}  ·  {{date | date('DD MMM YYYY')}}"
    thumbnail: image
    sortable_fields:
      fields: [title, date]
      default: { field: date, direction: descending }
    fields: &article_fields
      - { label: Headline, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: YYYY-MM-DD, time_format: false, default: "{{now}}" }
      - { label: "Main photo", name: image, widget: image, required: false, choose_url: true, hint: "Shown at the top of the post and on the list page." }
      - { label: "Story", name: body, widget: markdown, hint: "Write it like a Word document — headings, bold, lists. Please don't paste HTML code or photo dumps here; use the Photo gallery below." }
      - label: "Photo gallery (optional)"
        name: gallery
        widget: list
        required: false
        hint: "Extra photos, shown as a grid under the story. Click a photo on the site to enlarge it."
        field: { label: Photo, name: image, widget: image }
      - label: "Video (optional)"
        name: videos
        widget: list
        required: false
        summary: "{{fields.caption}}"
        hint: "Upload an MP4 OR paste a YouTube/Vimeo link — not both."
        fields:
          - { label: "Video file (MP4)", name: file, widget: file, required: false, media_folder: /public/assets/uploads, public_folder: /assets/uploads, hint: "Keep it under 20 MB." }
          - { label: "OR YouTube / Vimeo link", name: url, widget: string, required: false }
          - { label: Caption, name: caption, widget: string, required: false }
      - { label: "Short summary for Google & WhatsApp shares (optional)", name: description, widget: text, required: false, hint: "One or two sentences. If empty, the start of the story is used." }
      - { label: "Hide from the website (draft)", name: draft, widget: boolean, default: false, required: false }
      - { label: Type, name: type, widget: hidden, default: article }

  - name: events
    label: "Events"
    label_singular: Event
    icon: event
    description: "Upcoming and past events. Show on /event/ (newest first). The URL is created automatically from the title."
    folder: content/events
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "/event/{{slug}}/"
    permalink_field: true
    summary: "{{title}}  ·  {{date | date('DD MMM YYYY')}}"
    thumbnail: image
    sortable_fields:
      fields: [title, date]
      default: { field: date, direction: descending }
    fields: *article_fields

  - name: notices
    label: "Notices & PDFs"
    label_singular: Notice
    icon: description
    description: >-
      Circulars, NIRF, AISHE, AICTE, RTI, IQAC and other documents. Each one
      shows on /notices/ under its category. Upload the PDF, give it a title,
      pick a category — that's it.
    folder: content/notices
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "/notices/"
    summary: "{{title}}  ·  {{category}}  ·  {{date | date('DD MMM YYYY')}}"
    sortable_fields:
      fields: [title, date, category]
      default: { field: date, direction: descending }
    view_groups:
      - { label: Category, field: category }
    fields:
      - { label: Title, name: title, widget: string, hint: "e.g. “AISHE 2024–25” — this is the link text visitors click." }
      - label: "PDF or document"
        name: file
        widget: file
        media_folder: /public/assets/uploads
        public_folder: /assets/uploads
        hint: "Drag the PDF here, or click Browse to reuse one already uploaded."
      - label: Category
        name: category
        widget: select
        default: general
        options:
          - { label: General, value: general }
          - { label: Admission, value: admission }
          - { label: Academic, value: academic }
          - { label: "Compliance (NIRF / AISHE / AICTE)", value: compliance }
          - { label: IQAC, value: iqac }
          - { label: Mandatory disclosure, value: mandatory }
          - { label: Administration, value: admin }
      - { label: Date, name: date, widget: datetime, format: YYYY-MM-DD, time_format: false, default: "{{now}}" }
      - { label: "One-line description (optional)", name: description, widget: text, required: false }
      - { label: "Hide from the website (draft)", name: draft, widget: boolean, default: false, required: false }

  - name: fees
    label: "Fees & prospectus PDFs"
    label_singular: Fee document
    icon: payments
    description: "Fee structure and prospectus PDFs, listed on /fees/. To change the fee PDF linked from the header and footer, use “Contact, phone & admission button” instead."
    folder: content/fees
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "/fees/"
    summary: "{{title}}  ·  {{date | date('DD MMM YYYY')}}"
    fields:
      - { label: Title, name: title, widget: string, hint: "e.g. “Fee structure 2026–27”." }
      - label: "PDF file"
        name: file
        widget: file
        media_folder: /public/assets/uploads
        public_folder: /assets/uploads
      - { label: Date, name: date, widget: datetime, format: YYYY-MM-DD, time_format: false, default: "{{now}}" }
      - { label: "One-line description (optional)", name: description, widget: text, required: false }
      - { label: "Hide from the website (draft)", name: draft, widget: boolean, default: false, required: false }
      - { label: "Notes (optional)", name: body, widget: markdown, required: false }

  # ═══════════════════════════════ PAGES ═════════════════════════════════
  - divider: true

  - name: home
    label: "Homepage"
    icon: home
    description: "Every block on the homepage, listed top to bottom in the same order visitors see them. Open a block to edit it."
    files:
      - name: homepage
        label: "Homepage (top → bottom)"
        file: content/home/homepage.json
        preview_path: "/"
        fields:
          - label: "① Video at the very top"
            name: hero
            widget: object
            collapsed: true
            summary: "Full-width background video"
            fields:
              - label: Background video
                name: video
                widget: file
                media_folder: /public/assets/uploads
                public_folder: /assets/uploads
                hint: "MP4, plays muted on a loop. Keep it under ~15 MB — every visitor downloads it."

          - label: "② Three big buttons under the video"
            name: quick_actions
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            hint: "Admissions / Programmes / Prospectus tiles. The first tile is highlighted with an “Open” badge."
            fields:
              - { label: Title, name: title, widget: string }
              - { label: "Small text under the title", name: subtitle, widget: string }
              - { label: "Arrow text", name: cta_label, widget: string }
              - { label: "Goes to", name: url, widget: string, hint: "A page like /admission/ or a PDF address." }
              - { label: "Icon name", name: icon, widget: string, hint: "Font Awesome 4 name, e.g. pencil-square-o, graduation-cap, book. See fontawesome.com/v4/icons" }
              - label: Colour
                name: style
                widget: select
                default: primary
                options:
                  - { label: "Red", value: primary }
                  - { label: "Navy", value: navy }
                  - { label: "Light", value: light }

          - label: "③ Accreditation logos strip"
            name: accreditation
            widget: object
            collapsed: true
            summary: "{{fields.label}}"
            fields:
              - { label: "Small heading", name: label, widget: string }
              - label: Logos
                name: items
                widget: list
                collapsed: true
                summary: "{{fields.name}}"
                fields:
                  - { label: Logo, name: image, widget: image }
                  - { label: Name, name: name, widget: string }

          - label: "④ About the college (short intro)"
            name: about
            widget: object
            collapsed: true
            summary: "{{fields.heading}}"
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: value, widget: text }
              - { label: Button text, name: cta_label, widget: string }
              - { label: Button goes to, name: cta_url, widget: string }

          - label: "⑤ Numbers band (4000+ students …)"
            name: metrics
            widget: list
            collapsed: true
            summary: "{{fields.value}} {{fields.label}}"
            fields:
              - { label: Number, name: value, widget: string }
              - { label: Label, name: label, widget: string }

          - label: "⑥ Notice board strip"
            name: notice_strip
            widget: object
            collapsed: true
            summary: "{{fields.title}}"
            hint: "The single link bar to the notice board. To add a notice itself, use “Notices & PDFs” in the sidebar."
            fields:
              - { label: "Small label", name: kicker, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: "Link text", name: link_label, widget: string }
              - { label: "Goes to", name: url, widget: string, default: /notices/ }

          - label: "⑦ Recognitions on record (dark band)"
            name: credentials
            widget: object
            collapsed: true
            summary: "{{fields.heading}}"
            fields:
              - { label: "Small label", name: kicker, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text }
              - { label: Button text, name: cta_label, widget: string }
              - { label: Button goes to, name: cta_url, widget: string }
              - label: "Recognitions"
                name: items
                widget: list
                collapsed: true
                summary: "{{fields.label}}: {{fields.value}}"
                fields:
                  - { label: "Label (e.g. NAAC)", name: label, widget: string }
                  - { label: "Big value (e.g. B++)", name: value, widget: string }
                  - { label: "Small note", name: note, widget: string, required: false }
                  - label: "Certificate PDF (optional)"
                    name: document
                    widget: file
                    required: false
                    media_folder: /public/assets/uploads
                    public_folder: /assets/uploads
                    hint: "Adds a “View certificate ↗” link."
                  - { label: "OR website link (optional)", name: link, widget: string, required: false, hint: "Adds a “Visit site ↗” link. Use only when there's no PDF." }

          - label: "⑧ Chairman's message"
            name: chairman_message
            widget: object
            collapsed: true
            summary: "{{fields.kicker}}"
            hint: "Slide 1 of the leadership carousel."
            fields:
              - { label: "Name (big heading)", name: kicker, widget: string }
              - { label: "Role label (small text above the name)", name: heading, widget: string }
              - { label: Photo, name: photo, widget: image }
              - { label: "Photo links to", name: photo_url, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: value, widget: text }
              - { label: Link text, name: cta_label, widget: string }
              - { label: Link goes to, name: cta_url, widget: string }

          - label: "⑨ Principal's message"
            name: principal_message
            widget: object
            collapsed: true
            summary: "{{fields.kicker}}"
            hint: "Slide 2 of the leadership carousel."
            fields:
              - { label: "Name (big heading)", name: kicker, widget: string }
              - { label: "Role label (small text above the name)", name: heading, widget: string }
              - { label: Photo, name: photo, widget: image }
              - { label: "Photo links to", name: photo_url, widget: string }
              - { label: Quote, name: quote, widget: text }
              - label: Bullet points
                name: bullet_points
                widget: list
                field: { label: Point, name: value, widget: string }
              - { label: Link text, name: cta_label, widget: string }
              - { label: Link goes to, name: cta_url, widget: string }

          - label: "⑩ Programmes lists + department tiles"
            name: programmes
            widget: object
            collapsed: true
            summary: "{{fields.heading}}"
            hint: "The course durations shown next to each programme come from the “Programmes” collection automatically."
            fields:
              - { label: "Small label", name: kicker, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro sentence, name: intro, widget: text }
              - label: "UG (Honours) list"
                name: ug
                widget: object
                collapsed: true
                fields: &prog_list_fields
                  - { label: "Small label", name: level_tag, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: "Line under the title", name: meta, widget: string }
                  - label: Programmes
                    name: items
                    widget: list
                    collapsed: true
                    summary: "{{fields.label}}"
                    fields:
                      - { label: Name, name: label, widget: string }
                      - { label: "Goes to", name: url, widget: string, hint: "The programme's page, e.g. /programmes/bsc-microbiology/" }
                  - { label: "Note under the list (optional)", name: highlight_text, widget: text, required: false }
                  - { label: "Main button text", name: cta_primary_label, widget: string }
                  - { label: "Main button goes to", name: cta_primary_url, widget: string }
                  - { label: "Second button text", name: cta_secondary_label, widget: string }
                  - { label: "Second button goes to", name: cta_secondary_url, widget: string }
              - label: "PG list"
                name: pg
                widget: object
                collapsed: true
                fields: *prog_list_fields
              - { label: "Departments — small label", name: departments_kicker, widget: string }
              - { label: "Departments — heading", name: departments_heading, widget: string }
              - label: "Department tiles"
                name: departments
                widget: list
                collapsed: true
                summary: "{{fields.title}}"
                hint: "Drag to reorder. Tiles are numbered 01, 02 … automatically."
                fields:
                  - { label: Department name, name: title, widget: string }
                  - { label: Photo, name: image, widget: image }
                  - { label: "Goes to", name: url, widget: string }
                  - label: "Programmes offered (small tags)"
                    name: pills
                    widget: list
                    required: false
                    field: { label: Programme, name: value, widget: string }
              - { label: "“View all” text", name: view_all_label, widget: string }
              - { label: "“View all” goes to", name: view_all_url, widget: string }

          - label: "⑪ Photo carousels (Campus + Events)"
            name: gallery
            widget: object
            collapsed: true
            summary: "{{fields.heading}}"
            hint: "Two sliding photo boxes side by side."
            fields:
              - { label: "LEFT box — small label", name: kicker, widget: string }
              - { label: "LEFT box — heading", name: heading, widget: string }
              - { label: "LEFT box — link text", name: cta_label, widget: string }
              - { label: "LEFT box — link goes to", name: cta_url, widget: string }
              - label: "LEFT box — photos"
                name: slides
                widget: list
                collapsed: true
                summary: "{{fields.title}}"
                fields: &slide_fields
                  - { label: Photo, name: image, widget: image }
                  - { label: Title, name: title, widget: string }
                  - { label: Caption, name: caption, widget: string }
              - { label: "RIGHT box — small label", name: events_kicker, widget: string, required: false }
              - { label: "RIGHT box — heading", name: events_heading, widget: string, required: false }
              - { label: "RIGHT box — link text", name: events_cta_label, widget: string, required: false }
              - { label: "RIGHT box — link goes to", name: events_cta_url, widget: string, required: false }
              - label: "RIGHT box — photos"
                name: events_slides
                widget: list
                required: false
                collapsed: true
                summary: "{{fields.title}}"
                hint: "Leave empty to hide the right box."
                fields: *slide_fields

          - label: "⑫ Placements & partners"
            name: placement
            widget: object
            collapsed: true
            summary: "{{fields.heading}}"
            hint: "The clubs & cells band just above this fills itself in from the Clubs & Cells pages — nothing to edit here."
            fields:
              - { label: "Small label", name: kicker, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text }
              - { label: Button text, name: cta_label, widget: string }
              - { label: Button goes to, name: cta_url, widget: string }
              - label: "Number cards"
                name: stats
                widget: list
                collapsed: true
                summary: "{{fields.value}} {{fields.label}}"
                fields:
                  - { label: "Number (e.g. 100+)", name: value, widget: string }
                  - { label: Label, name: label, widget: string }
                  - { label: Small note, name: note, widget: string, required: false }
              - { label: "Partners heading", name: partners_heading, widget: string }
              - label: "Partners"
                name: partners
                widget: list
                collapsed: true
                summary: "{{fields.name}}"
                fields:
                  - { label: "Short name (big text, e.g. TCS)", name: short, widget: string }
                  - { label: Full name, name: name, widget: string }
                  - { label: "Sector", name: sector, widget: string, required: false }
              - label: "Training pillars"
                name: pillars
                widget: list
                collapsed: true
                summary: "{{fields.title}}"
                hint: "Numbered 01–04 automatically."
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }

          - label: "⑬ Why choose AJAS + Apply box"
            name: benefits
            widget: object
            collapsed: true
            summary: "{{fields.heading}}"
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Reasons
                name: items
                widget: list
                collapsed: true
                summary: "{{fields.title}}"
                hint: "Usually 4 — they sit in a 2×2 grid."
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: "Goes to", name: url, widget: string }
              - { label: "Apply box — heading", name: cta_heading, widget: string }
              - { label: "Apply box — text", name: cta_text, widget: text }
              - { label: "Apply box — main button text", name: cta_primary_label, widget: string }
              - { label: "Apply box — main button goes to", name: cta_primary_url, widget: string }
              - { label: "Apply box — second link text", name: cta_secondary_label, widget: string }
              - { label: "Apply box — second link goes to", name: cta_secondary_url, widget: string }

          - label: "⑭ Student testimonials"
            name: testimonials
            widget: object
            collapsed: true
            summary: "{{fields.heading}}"
            fields:
              - { label: "Small label", name: kicker, widget: string }
              - { label: Heading, name: heading, widget: string }
              - label: Testimonials
                name: items
                widget: list
                collapsed: true
                summary: "{{fields.name}}"
                fields:
                  - { label: Quote, name: quote, widget: text }
                  - { label: Name, name: name, widget: string }
                  - { label: "Course / batch", name: role, widget: string }
                  - { label: Photo, name: photo, widget: image }

          - label: "⑮ “Ready to get started?” + quick links (bottom)"
            name: quick_link_cta
            widget: object
            collapsed: true
            summary: "{{fields.heading}}"
            fields:
              - { label: "Small label", name: kicker, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: "Main button text", name: primary_label, widget: string }
              - { label: "Main button goes to", name: primary_url, widget: string }
              - { label: "Second button text", name: secondary_label, widget: string }
              - { label: "Second button goes to", name: secondary_url, widget: string }
              - { label: "Quick links — heading", name: quicklinks_heading, widget: string }
              - label: Quick links
                name: quicklinks
                widget: list
                collapsed: true
                summary: "{{fields.label}}"
                fields:
                  - { label: Text, name: label, widget: string }
                  - { label: "Goes to (page or PDF)", name: url, widget: string }
                  - { label: "Open in a new tab (tick for PDFs)", name: external, widget: boolean, default: false }

          - { label: "Browser tab title", name: title, widget: string, hint: "Shown in the browser tab and Google results as “<this> | Al Jamia Arts & Science College”." }
          - { label: "Google description", name: description, widget: text, hint: "The grey text under the link in Google results. About 150 characters." }

  - name: pages
    label: "All other pages"
    label_singular: Page
    icon: article
    description: >-
      About, IQAC, admission, hostel, labs, clubs & cells, departments,
      policies… every other page. Folders on the left match the website's
      sections. Tip: on the live site, the “Edit this page” button opens the
      right one for you.
    folder: content/pages
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    path: "{{slug}}"
    preview_path: "/{{slug}}/"
    nested:
      depth: 4
      summary: "{{title}}"
    summary: "{{title}}"
    thumbnail: image
    fields:
      - { label: Page title, name: title, widget: string }
      - { label: "Page content", name: body, widget: markdown, required: false, hint: "Write it like a Word document — headings, bold, lists, tables. Don't paste HTML, photo dumps or staff lists here; use the sections below so they show as proper grids." }
      - { label: "Banner / main photo (optional)", name: image, widget: image, required: false, choose_url: true }
      - label: "Downloads — PDFs, forms, brochures (optional)"
        name: attachments
        widget: list
        required: false
        summary: "{{fields.label}}"
        hint: "Shows as a download list at the bottom of the page."
        fields:
          - { label: "Link text", name: label, widget: string, hint: "e.g. “Hostel application form”." }
          - label: File
            name: file
            widget: file
            media_folder: /public/assets/uploads
            public_folder: /assets/uploads
      - label: "People — staff / committee members (optional)"
        name: people
        widget: list
        required: false
        summary: "{{fields.name}} — {{fields.role}}"
        hint: "Shows as a grid of photo cards."
        fields:
          - { label: Name, name: name, widget: string }
          - { label: "Role / designation", name: role, widget: string, required: false }
          - { label: Photo, name: photo, widget: image, required: false }
          - { label: "Phone (optional)", name: phone, widget: string, required: false }
      - label: "Photo gallery (optional)"
        name: gallery
        widget: list
        required: false
        hint: "Shows as a photo grid at the bottom of the page; click to enlarge."
        field: { label: Photo, name: image, widget: image }
      - label: "Videos (optional)"
        name: videos
        widget: list
        required: false
        summary: "{{fields.caption}}"
        hint: "Upload an MP4 OR paste a YouTube/Vimeo link — not both."
        fields:
          - { label: "Video file (MP4)", name: file, widget: file, required: false, media_folder: /public/assets/uploads, public_folder: /assets/uploads, hint: "Keep it under 20 MB." }
          - { label: "OR YouTube / Vimeo link", name: url, widget: string, required: false }
          - { label: Caption, name: caption, widget: string, required: false }
      - label: "Link cards (optional)"
        name: menu_items
        widget: list
        required: false
        summary: "{{fields.title}}"
        hint: "For a page that is mostly a list of links to other pages — shows as a grid of cards."
        fields:
          - { label: Title, name: title, widget: string }
          - { label: "Goes to", name: href, widget: string, required: false }
          - { label: Description, name: description, widget: text, required: false }
      - { label: "Google description (optional)", name: description, widget: text, required: false, hint: "One or two sentences for Google and WhatsApp previews." }
      - { label: "Web address (leave empty)", name: permalink, widget: string, required: false, hint: "Leave empty — the address is made from the file name automatically. Only fill it to force a different address, e.g. /admission/." }
      - label: "Layout"
        name: type
        widget: select
        default: page
        options:
          - { label: "Normal page", value: page }
          - { label: "Person profile (photo + name + role)", value: profile }
          - { label: "Index of links (uses Link cards)", value: listing }
          - { label: "Article", value: article }
          - { label: "Home (don't use)", value: home }
      - { label: "Person's name (profile layout only)", name: name, widget: string, required: false }
      - { label: "Person's role (profile layout only)", name: role, widget: string, required: false }
      - { label: "Qualifications (profile layout only)", name: credentials, widget: string, required: false }
      - { label: "Hide from the website (draft)", name: draft, widget: boolean, default: false, required: false }

  - name: programmes
    label: "Programmes (courses)"
    label_singular: Programme
    icon: school
    description: "UG / PG courses. Each has its own page and is listed on /programmes/. The URL is created automatically."
    folder: content/programmes
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "/programmes/{{slug}}/"
    permalink_field: true
    summary: "{{title}}  ·  {{level | upper}}"
    sortable_fields:
      fields: [title, level, order]
      default: { field: order, direction: ascending }
    view_groups:
      - { label: Level, field: level }
    fields:
      - { label: Programme name, name: title, widget: string, hint: "e.g. B.Sc Microbiology (Honours)" }
      - label: Level
        name: level
        widget: select
        default: ug
        options:
          - { label: "UG (Honours)", value: ug }
          - { label: PG, value: pg }
          - { label: Certificate, value: certificate }
          - { label: Other, value: other }
      - { label: Duration, name: duration, widget: string, required: false, hint: "e.g. “4 Years (FYUGP)” — also shown on the homepage list." }
      - { label: "Programme details", name: body, widget: markdown, hint: "Write it like a Word document. No HTML." }
      - { label: "Department (optional)", name: department, widget: string, required: false }
      - { label: "Seats (optional)", name: seats, widget: string, required: false }
      - { label: "Google description (optional)", name: description, widget: text, required: false }
      - { label: "Position in lists", name: order, widget: number, default: 0, value_type: int, hint: "Lower numbers come first." }
      - { label: "Hide from the website (draft)", name: draft, widget: boolean, default: false, required: false }

  - name: faculty
    label: "Faculty"
    label_singular: Faculty member
    icon: badge
    description: "Teacher profiles. Each has its own page and appears on /faculties/ and on their department page. The URL is created automatically."
    folder: content/faculty
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "/faculties/{{slug}}/"
    permalink_field: true
    summary: "{{title}}  ·  {{role}}"
    thumbnail: image
    fields:
      - { label: Full name, name: title, widget: string }
      - { label: Photo, name: image, widget: image, required: false, choose_url: true, hint: "A head-and-shoulders photo, portrait orientation." }
      - { label: "Role (e.g. Assistant Professor, HoD)", name: role, widget: string, required: false }
      - { label: "Qualifications (e.g. M.Sc, NET, Ph.D.)", name: credentials, widget: string, required: false }
      - { label: "Biography", name: body, widget: markdown, hint: "Write it like a Word document. No HTML." }
      - { label: "Name as displayed (optional)", name: name, widget: string, required: false, hint: "Only if it should differ from the full name." }
      - { label: "Google description (optional)", name: description, widget: text, required: false }
      - { label: "Hide from the website (draft)", name: draft, widget: boolean, default: false, required: false }
      - { label: Type, name: type, widget: hidden, default: profile }

  # ══════════════════════════════ SITE-WIDE ══════════════════════════════
  - divider: true

  - name: navigation
    label: "Main menu"
    icon: menu
    description: "The menu at the top of every page. Drag items to reorder; add Sub-items to make a dropdown. A link can be a page (/admission/) or a PDF."
    files:
      - name: main_menu
        label: Main navigation
        file: content/settings/navigation.json
        preview_path: "/"
        fields:
          - label: "Top utility bar (small links above the logo)"
            name: utility
            widget: list
            summary: "{{fields.label}}"
            hint: "The small Alumni / Placement Cell / Payments / Career / Contact row above the main logo."
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }
          - label: Main menu
            name: main
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: "Link (page path or PDF URL)", name: href, widget: string, required: false, hint: "e.g. /admission/ or /assets/uploads/….pdf" }
              - label: Sub-items
                name: children
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string, required: false }
                  - label: Nested sub-items
                    name: children
                    widget: list
                    required: false
                    summary: "{{fields.label}}"
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: Link, name: href, widget: string, required: false }
                      - label: Nested sub-items
                        name: children
                        widget: list
                        required: false
                        summary: "{{fields.label}}"
                        fields:
                          - { label: Label, name: label, widget: string }
                          - { label: Link, name: href, widget: string, required: false }

  - name: footer
    label: "Footer"
    icon: dock_to_bottom
    description: "The dark area at the bottom of every page — logos, link columns, social media, map. (Address, phone and email come from “Contact, phone & admission button”.)"
    files:
      - name: footer
        label: Site footer
        file: content/settings/footer.json
        preview_path: "/"
        fields:
          - { label: "Accreditation line (small text above the logos)", name: trust_line, widget: string, required: false }
          - label: Accreditation logos
            name: trust_marks
            widget: list
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { label: Logo image, name: image, widget: image }
              - { label: Name, name: name, widget: string }
          - label: "Footer link columns"
            name: columns
            widget: list
            collapsed: true
            summary: "{{fields.heading}}"
            hint: "Usually 3 columns (College / Academics / Students). Add, remove, or relabel freely."
            fields:
              - { label: Column heading, name: heading, widget: string }
              - label: Links
                name: links
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
          - label: "Follow us (social links)"
            name: social
            widget: list
            collapsed: true
            summary: "{{fields.icon}}"
            fields:
              - { label: "Icon (Font Awesome name, no \"fa-\" prefix)", name: icon, widget: string, hint: "e.g. facebook, instagram, linkedin, youtube-play — browse names at fontawesome.com/v4/icons" }
              - { label: Profile URL, name: url, widget: string }
              - { label: "Accessible label (optional)", name: label, widget: string, required: false }
          - { label: "Map embed URL", name: map_embed_url, widget: string, required: false, hint: "Google Maps → Share → Embed a map → copy the src=\"...\" URL." }
          - { label: "\"Open in Google Maps\" link", name: map_link_url, widget: string, required: false }
          - label: "Bottom bar links"
            name: bottom_nav
            widget: list
            collapsed: true
            summary: "{{fields.label}}"
            hint: "The small link row next to the copyright line."
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }

  - name: listings
    label: "List page intros"
    icon: view_list
    description: "The heading and intro paragraph at the top of each list page: /college-news/, /event/, /notices/, /fees/, /programmes/, /faculties/, /departments/, /labs/, /clubs--cells/."
    files:
      - name: listings
        label: Section intros
        file: content/settings/listings.json
        preview_path: "/college-news/"
        fields:
          - label: News
            name: news
            widget: object
            collapsed: true
            fields: &section_fields
              - { label: Page heading, name: title, widget: string }
              - { label: "Search-engine description", name: description, widget: text }
              - { label: Intro paragraph, name: intro, widget: text }
          - label: Events
            name: events
            widget: object
            collapsed: true
            fields: *section_fields
          - label: Notices
            name: notices
            widget: object
            collapsed: true
            fields: *section_fields
          - label: Fees
            name: fees
            widget: object
            collapsed: true
            fields: *section_fields
          - label: Programmes
            name: programmes
            widget: object
            collapsed: true
            fields: *section_fields
          - label: Faculties
            name: faculties
            widget: object
            collapsed: true
            fields: *section_fields
          - label: Departments
            name: departments
            widget: object
            collapsed: true
            fields: *section_fields
          - label: Labs
            name: labs
            widget: object
            collapsed: true
            fields: *section_fields
          - label: Clubs & Cells
            name: clubs
            widget: object
            collapsed: true
            fields: *section_fields

  - name: prospectus
    label: "Prospectus page"
    icon: menu_book
    description: "Every section of the /prospectus-2026-27/ page, top to bottom. To replace the downloadable prospectus PDF, use “Contact, phone & admission button”."
    files:
      - name: prospectus
        label: Prospectus page
        file: content/settings/prospectus.json
        preview_path: "/prospectus-2026-27/"
        fields:
          - label: "1 · Hero"
            name: hero
            widget: object
            collapsed: true
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Tagline, name: tagline, widget: string }
              - { label: "Lead line (accreditation strip)", name: lead, widget: string }
          - label: "2 · About Us"
            name: about
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: value, widget: text }
          - label: "3 · At a glance stats"
            name: glance
            widget: list
            collapsed: true
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Value, name: value, widget: string }
          - { label: "4 · Vision", name: vision, widget: text }
          - { label: "5 · Mission", name: mission, widget: text }
          - label: "6 · Management Committee"
            name: committee
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Members
                name: members
                widget: list
                summary: "{{fields.name}} — {{fields.role}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Role, name: role, widget: string }
              - { label: "Note (optional, supports a [link](/path/) )", name: note, widget: string, required: false }
          - label: "7 · Programmes & Fees"
            name: programmes
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Intro paragraph, name: intro, widget: text }
              - { label: "UG section heading", name: ug_heading, widget: string }
              - label: UG programmes
                name: ug
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Eligibility, name: eligibility, widget: text }
                  - { label: "Fee / semester (₹, digits only)", name: fee, widget: string }
              - { label: "PG section heading", name: pg_heading, widget: string }
              - label: PG programmes
                name: pg
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Eligibility, name: eligibility, widget: text }
                  - { label: "Fee / semester (₹, digits only)", name: fee, widget: string }
          - label: "8 · Add-On / Certificate Courses"
            name: addon
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text }
              - label: Courses
                name: courses
                widget: list
                field: { label: Course, name: value, widget: string }
          - label: "9 · Infrastructure"
            name: infrastructure
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Items
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: "Icon (Font Awesome class, e.g. fa-book)", name: icon, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
          - label: "10 · Flagship programmes"
            name: flagship
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Cards
                name: items
                widget: list
                summary: "{{fields.kicker}}"
                hint: "Usually exactly 2 cards."
                fields:
                  - { label: Name, name: kicker, widget: string }
                  - { label: Text, name: text, widget: text }
          - label: "11 · Admission process"
            name: admission
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: "Management admission — title", name: management_title, widget: string }
              - label: "Management admission — steps"
                name: management_steps
                widget: list
                field: { label: Step, name: value, widget: text }
              - { label: "Merit admission — title", name: merit_title, widget: string }
              - label: "Merit admission — steps"
                name: merit_steps
                widget: list
                field: { label: Step, name: value, widget: text }
              - { label: "Note (optional)", name: note, widget: text, required: false }
          - label: "12 · Download CTA"
            name: download_cta
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Button label, name: button_label, widget: string }

  - name: settings
    label: "Contact, phone & admission button"
    icon: call
    description: "College name, phone, email and address (header, footer, contact page), the red admission button in the header, and the fee / prospectus PDFs linked across the site."
    files:
      - name: site
        label: "Contact & admission"
        file: content/settings/site.json
        preview_path: "/"
        fields:
          - { label: College name, name: college_name, widget: string }
          - { label: "Short name", name: short_name, widget: string, required: false }
          - { label: Tagline, name: tagline, widget: string, required: false }
          - { label: "Phone (digits for the call link, e.g. +917994188918)", name: phone, widget: string }
          - { label: "Phone as displayed (e.g. +91 7994 188918)", name: phone_display, widget: string, required: false }
          - { label: Email, name: email, widget: string }
          - { label: Address, name: address, widget: text }
          - { label: Logo, name: logo, widget: image, required: false, choose_url: true }
          - { label: "Admissions open? (shows the admission button)", name: admission_open, widget: boolean, default: true }
          - { label: "Admission button text", name: admission_label, widget: string, required: false }
          - { label: "Admission button goes to", name: admission_url, widget: string, required: false }
          - { label: "Admission note", name: admission_note, widget: string, required: false }
          - label: "Fee structure PDF (linked site-wide)"
            name: fee_pdf
            widget: file
            required: false
            media_folder: /public/assets/uploads
            public_folder: /assets/uploads
          - label: "Prospectus PDF (linked site-wide)"
            name: prospectus_pdf
            widget: file
            required: false
            media_folder: /public/assets/uploads
            public_folder: /assets/uploads
