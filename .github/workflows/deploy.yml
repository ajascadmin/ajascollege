name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue CMS deploys; do not cancel an in-flight production deploy
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          # Trim whitespace/newlines from secrets (common paste mistake)
          TOKEN=$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          ACCOUNT=$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. GitHub → Settings → Secrets and variables → Actions → set CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty. Expected: 885696ed5faef85a5de48ee3fda26f4f"
            exit 1
          fi

          echo "Token length: ${#TOKEN} (API tokens are usually 40+ chars)"
          echo "Account ID length: ${#ACCOUNT} (should be 32 hex chars)"
          echo "Account ID prefix: ${ACCOUNT:0:6}…"

          # Correct verify endpoint (NOT /accounts/.../tokens/verify — that 403s valid Pages tokens)
          code=$(curl -sS -o /tmp/cf-verify.json -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" || echo "000")

          echo "user/tokens/verify → HTTP $code"
          cat /tmp/cf-verify.json || true
          echo ""

          if [ "$code" != "200" ]; then
            echo "::error::Token rejected by Cloudflare (HTTP $code). Re-create an API Token (not Global API Key) and paste the full value into CLOUDFLARE_API_TOKEN with no quotes/spaces."
            exit 1
          fi

          # Confirm Pages access on this account (what deploy needs)
          code2=$(curl -sS -o /tmp/cf-pages.json -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/pages/projects/ajascollege" || echo "000")

          echo "pages/projects/ajascollege → HTTP $code2"
          cat /tmp/cf-pages.json || true
          echo ""

          if [ "$code2" = "404" ]; then
            echo "Pages project 'ajascollege' does not exist yet on this account. Creating it automatically..."
            create_code=$(curl -sS -o /tmp/cf-create.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"name":"ajascollege","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/pages/projects" || echo "000")
            echo "pages create → HTTP $create_code"
            cat /tmp/cf-create.json || true
            echo ""
          elif [ "$code2" != "200" ]; then
            echo "::error::Token is valid but cannot access Pages project on account ${ACCOUNT:0:6}… (HTTP $code2). Ensure token has Account → Cloudflare Pages → Edit permission."
            exit 1
          fi

          echo "Cloudflare token + Pages project access OK."
          # Export trimmed values for later steps via GITHUB_ENV
          {
            echo "CLOUDFLARE_API_TOKEN=${TOKEN}"
            echo "CLOUDFLARE_ACCOUNT_ID=${ACCOUNT}"
          } >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      - name: Build (Astro + Pagefind)
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          # Prefer trimmed values from verify step when set
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ajascollege --branch main
